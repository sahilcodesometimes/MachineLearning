<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="760" fill="#ffffff"/>

  <text x="60" y="70" font-size="26" font-weight="600" fill="#111111">Machine Learning Roadmap</text>
  <line x1="60" y1="92" x2="740" y2="92" stroke="#e5e5e5" stroke-width="1"/>

  <!-- 0 -->
  <text x="60" y="140" font-size="14" fill="#999999">01</text>
  <text x="110" y="140" font-size="18" font-weight="600" fill="#111111">Python</text>
  <text x="110" y="164" font-size="14" fill="#555555">Syntax, data structures, OOP, file handling, Git</text>

  <!-- 1 -->
  <text x="60" y="222" font-size="14" fill="#999999">02</text>
  <text x="110" y="222" font-size="18" font-weight="600" fill="#111111">Mathematics</text>
  <text x="110" y="246" font-size="14" fill="#555555">Calculus, linear algebra, probability and statistics</text>

  <!-- 2 -->
  <text x="60" y="304" font-size="14" fill="#999999">03</text>
  <text x="110" y="304" font-size="18" font-weight="600" fill="#111111">Data Tools</text>
  <text x="110" y="328" font-size="14" fill="#555555">NumPy, Pandas, Matplotlib, Seaborn, exploratory analysis</text>

  <!-- 3 -->
  <text x="60" y="386" font-size="14" fill="#999999">04</text>
  <text x="110" y="386" font-size="18" font-weight="600" fill="#111111">Classical Machine Learning</text>
  <text x="110" y="410" font-size="14" fill="#555555">Regression, trees, random forests, SVM, clustering, PCA, evaluation</text>

  <!-- 4 -->
  <text x="60" y="468" font-size="14" fill="#999999">05</text>
  <text x="110" y="468" font-size="18" font-weight="600" fill="#111111">Deep Learning</text>
  <text x="110" y="492" font-size="14" fill="#555555">Neural networks, backpropagation, PyTorch, CNNs, RNNs, Transformers</text>

  <!-- 5 -->
  <text x="60" y="550" font-size="14" fill="#999999">06</text>
  <text x="110" y="550" font-size="18" font-weight="600" fill="#111111">LLMs and Generative AI</text>
  <text x="110" y="574" font-size="14" fill="#555555">Embeddings, prompting, RAG, vector databases, fine-tuning</text>

  <!-- 6 -->
  <text x="60" y="632" font-size="14" fill="#999999">07</text>
  <text x="110" y="632" font-size="18" font-weight="600" fill="#111111">APIs and Deployment</text>
  <text x="110" y="656" font-size="14" fill="#555555">FastAPI, Docker, CI/CD, model serving, cloud basics</text>

  <line x1="60" y1="690" x2="740" y2="690" stroke="#e5e5e5" stroke-width="1"/>
  <text x="60" y="720" font-size="13" fill="#999999">Learn in order, practice with projects at every stage.</text>
</svg>
